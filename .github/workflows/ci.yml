name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/linkops-api

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api

    steps:
      # Chunk 1: Checkout and Setup
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Chunk 1: Install dependencies
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      # Chunk 1: Lint step
      - name: Run linter (ruff)
        run: pip install ruff && ruff check .

      # Chunk 1: Test step
      - name: Run tests
        run: pip install pytest && pytest

  build-and-push:
    name: Build and Push Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: api

    permissions:
      contents: read
      packages: write

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Chunk 2: Set up Docker Buildx for efficient multi-stage builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Chunk 2: Build Docker image with git SHA tag
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: api
          file: api/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      # Chunk 2: Check image size before pushing
      - name: Check Docker image size
        run: |
          docker load --input /tmp/image.tar
          SIZE=$(docker image inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} --format='{{.Size}}' | tr -d '\n')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 200 ]; then
            echo "ERROR: Image exceeds 200MB threshold (actual: ${SIZE_MB}MB)"
            exit 1
          fi

      # Chunk 3: Log in to GitHub Container Registry
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Chunk 3: Push image with git SHA tag
      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Chunk 3: Log image details
      - name: Log image details
        run: |
          echo "Successfully pushed image:"
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Image: ${{ env.IMAGE_NAME }}"
          echo "SHA Tag: ${{ github.sha }}"
          echo "Latest Tag: latest"
